# Installed by serverroom-monitor. Grafana settings are environment overrides
# (GF_*) so the packaged grafana.ini stays untouched across upgrades.
[Unit]
StartLimitIntervalSec=0

[Service]
EnvironmentFile=/etc/serverroom-monitor/generated/grafana-settings.env
EnvironmentFile=/etc/serverroom-monitor/env/grafana.env
Restart=always
RestartSec=10
