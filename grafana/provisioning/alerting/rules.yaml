            type: gt
            params:
            - 180.0
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: No sensor data from server-room for {{ with $values.B }}{{ humanizeDuration .Value }}{{ else }}over 6 hours (or InfluxDB is unreachable){{ end }}
      description: The last reading is older than 3m. Check the collector (journalctl -u serverroom-monitor), InfluxDB and the sensor wiring.
    labels:
      severity: critical
      service: serverroom
    isPaused: false
