  - uid: sr-stale
    title: No data from sensor
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: serverroom-influx
      model:
        refId: A
        query: |-
          from(bucket: "serverroom_raw")
            |> range(start: -6h)
            |> filter(fn: (r) => r._measurement == "environment" and r._field == "temperature" and r.location == "server-room")
            |> last()
            |> map(fn: (r) => ({_time: r._time, location: r.location, _value: float(v: uint(v: now()) - uint(v: r._time)) / 1000000000.0}))
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
