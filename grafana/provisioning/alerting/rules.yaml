# Generated by `serverroom-monitor render-grafana` from config.yaml. Do not edit.
apiVersion: 1
groups:
- orgId: 1
  name: serverroom
  folder: Server Room
  interval: 1m
  rules:
  - uid: sr-temp-warn
    title: Temperature high (warning)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: serverroom-influx
      model:
        refId: A
        query: |-
          from(bucket: "serverroom_raw")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "environment" and r._field == "temperature" and r.location == "server-room")
            |> keep(columns: ["_time", "_value", "location"])
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 27.0
    noDataState: KeepLast
    execErrState: KeepLast
    for: 2m
    annotations:
      summary: Temperature in {{ $labels.location }} is {{ printf "%.1f" $values.B.Value }} °C (warning above 27 °C)
      description: Temperature has been above 27 °C for at least 2m.
    labels:
      severity: warning
      service: serverroom
    isPaused: false
