# Generated by `serverroom-monitor render-grafana` from config.yaml. Do not edit.
apiVersion: 1
templates:
- orgId: 1
  name: serverroom
  template: |-
    {{ define "serverroom.title" -}}
    {{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}🔴 CRITICAL{{ else }}🟠 WARNING{{ end }}{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}
    {{- end }}

    {{ define "serverroom.message" -}}
    {{ range .Alerts.Firing }}🔥 {{ .Annotations.summary }}
    {{ end }}{{ range .Alerts.Resolved }}✅ Resolved: {{ .Annotations.summary }}
    {{ end }}
    {{- end }}

    {{ define "serverroom.text" -}}
    {{ template "serverroom.title" . }}
    {{ template "serverroom.message" . }}
    {{- end }}
contactPoints:
- orgId: 1
  name: serverroom-notify
  receivers:
  - uid: sr-none
    type: webhook
    disableResolveMessage: true
    settings:
      url: http://127.0.0.1:9/no-notification-channel-configured
      httpMethod: POST
deleteContactPoints:
- orgId: 1
  uid: sr-deadman
- orgId: 1
  uid: sr-email
- orgId: 1
  uid: sr-telegram
- orgId: 1
  uid: sr-webhook
