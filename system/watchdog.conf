# /etc/systemd/system.conf.d/serverroom-watchdog.conf  (installed by serverroom-monitor)
# systemd (PID 1) feeds the BCM2835 hardware watchdog. If the kernel or PID 1
# hangs for 15 s the SoC resets itself. 15 s is close to the BCM2835 maximum
# (~15.9 s). RebootWatchdogSec bounds a hung shutdown/reboot.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
