# /etc/systemd/journald.conf.d/serverroom.conf  (installed by serverroom-monitor)
# Persistent but bounded journal: logs survive reboots (you want them after a
# crash), while size limits and batched syncs keep SSD/SD writes low.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=1G
MaxRetentionSec=1month
MaxFileSec=1week
# Flush to disk every 5 min; crit/alert/emerg messages are always synced at once.
SyncIntervalSec=5m
RateLimitIntervalSec=30s
RateLimitBurst=1000
