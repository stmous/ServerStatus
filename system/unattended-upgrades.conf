// /etc/apt/apt.conf.d/51serverroom-unattended-upgrades  (installed by serverroom-monitor)
// Security updates only. Grafana and InfluxDB come from their own repos and
// are upgraded manually (a major Grafana upgrade can change provisioning
// behaviour; see README "Upgrading").
Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
        "origin=Debian,codename=${distro_codename},label=Debian";
        "origin=Raspberry Pi Foundation,codename=${distro_codename}";
        "origin=Tailscale";
};
Unattended-Upgrade::Package-Blacklist {
        "grafana";
        "grafana-enterprise";
        "influxdb2";
        "influxdb2-cli";
};
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
// Kernel/firmware updates need a reboot. Off by default so a monitored room
// never loses its monitor at an unexpected moment; set to "true" and pick a
// quiet time if you prefer automatic reboots.
Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Automatic-Reboot-Time "04:30";
Unattended-Upgrade::SyslogEnable "true";
